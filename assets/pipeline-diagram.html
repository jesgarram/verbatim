<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verbatim Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,500;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --border: #e5e1db;
    --border-light: #efecea;
    --text: #1a1a1a;
    --text-sec: #6b6560;
    --text-muted: #a09a93;
    --structure: #5b6abf;
    --structure-bg: #f2f3fa;
    --structure-border: #d4d8ee;
    --polish: #8b7355;
    --polish-bg: #f8f5f0;
    --polish-border: #e2dbd0;
    --refine: #c0392b;
    --refine-bg: #fdf2f0;
    --refine-border: #efd2cd;
    --voice: #1a7a6a;
    --voice-bg: #eef7f5;
    --voice-border: #c8e2dc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Source Serif 4', Georgia, serif;
    display: flex;
    justify-content: center;
    padding: 48px 24px 56px;
    -webkit-font-smoothing: antialiased;
  }

  .diagram { width: 100%; max-width: 960px; }

  /* ── Unified layout ── */
  .unified {
    display: grid;
    grid-template-columns: auto 36px 1fr 36px auto;
    align-items: center;
    gap: 0;
  }

  .io {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-sec);
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    white-space: nowrap;
  }

  .io-arrow {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ── Verbatim box ── */
  .verbatim-box {
    border: 1px solid var(--border-light);
    border-radius: 16px;
    padding: 28px 24px 20px;
    background: var(--surface);
    position: relative;
  }

  .verbatim-tag {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    background: var(--surface);
    padding: 0 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── Steps row ── */
  .steps {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: center;
    gap: 0;
  }

  .step {
    border-radius: 10px;
    padding: 16px 24px;
    text-align: center;
  }

  .step-name {
    font-family: 'DM Mono', monospace;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .step-desc {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    font-weight: 300;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .step-structure { background: var(--structure-bg); border: 1px solid var(--structure-border); }
  .step-structure .step-name { color: var(--structure); }
  .step-polish { background: var(--polish-bg); border: 1px solid var(--polish-border); }
  .step-polish .step-name { color: var(--polish); }
  .step-refine { background: var(--refine-bg); border: 1px solid var(--refine-border); }
  .step-refine .step-name { color: var(--refine); }

  .step-arrow {
    display: flex;
    align-items: center;
    padding: 0 6px;
  }

  /* ── Voice profile row (same grid) ── */
  .voice-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr auto 1fr;
    align-items: start;
    gap: 0;
    margin-top: 10px;
  }

  .voice-empty { }

  .voice-up {
    display: flex;
    justify-content: center;
    padding-top: 2px;
  }

  .voice-center {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .voice-pill {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--voice);
    background: var(--voice-bg);
    border: 1px solid var(--voice-border);
    padding: 5px 14px;
    border-radius: 6px;
    white-space: nowrap;
    grid-column: 1;
    justify-self: start;
  }

  /* Voice row v2: pill on left, dashed lines up to polish & refine */
  .voice-row-v2 {
    display: flex;
    align-items: center;
    margin-top: 12px;
    gap: 0;
    position: relative;
    height: 32px;
  }

  .voice-pill-v2 {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 400;
    color: var(--voice);
    background: var(--voice-bg);
    border: 1px solid var(--voice-border);
    padding: 5px 14px;
    border-radius: 6px;
    white-space: nowrap;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  /* Use absolute positioned SVG for the connector lines */
  .voice-svg-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="diagram">

  <div class="unified">

    <div class="io">transcript</div>

    <div class="io-arrow">
      <svg width="36" height="16" viewBox="0 0 36 16" fill="none">
        <path d="M2 8H26" stroke="var(--border)" stroke-width="1"/>
        <path d="M24 4L32 8L24 12" stroke="var(--text-muted)" stroke-width="1" fill="none"/>
      </svg>
    </div>

    <div class="verbatim-box" id="vbox">
      <span class="verbatim-tag">Verbatim</span>

      <div class="steps">
        <div class="step step-structure">
          <div class="step-name">Structure</div>
            </div>

        <div class="step-arrow">
          <svg width="36" height="16" viewBox="0 0 36 16" fill="none">
            <path d="M2 8H26" stroke="var(--border)" stroke-width="1"/>
            <path d="M24 4L32 8L24 12" stroke="var(--text-muted)" stroke-width="1" fill="none"/>
          </svg>
        </div>

        <div class="step step-polish" id="polish">
          <div class="step-name">Polish</div>
            </div>

        <div class="step-arrow">
          <svg width="36" height="16" viewBox="0 0 36 16" fill="none">
            <path d="M2 8H26" stroke="var(--border)" stroke-width="1"/>
            <path d="M24 4L32 8L24 12" stroke="var(--text-muted)" stroke-width="1" fill="none"/>
          </svg>
        </div>

        <div class="step step-refine" id="refine">
          <div class="step-name">Refine</div>
            </div>
      </div>

      <!-- Voice profile with JS-positioned lines -->
      <div style="position:relative; margin-top:12px; display:flex;">
        <div class="voice-pill-v2" id="vpill">voice profile</div>
        <svg id="voice-lines" style="position:absolute; top:0; left:0; width:100%; height:100%; overflow:visible; pointer-events:none;"></svg>
      </div>

    </div>

    <div class="io-arrow">
      <svg width="36" height="16" viewBox="0 0 36 16" fill="none">
        <path d="M2 8H26" stroke="var(--border)" stroke-width="1"/>
        <path d="M24 4L32 8L24 12" stroke="var(--text-muted)" stroke-width="1" fill="none"/>
      </svg>
    </div>

    <div class="io">article</div>

  </div>

</div>

<script>
function drawLines() {
  const pill = document.getElementById('vpill');
  const polish = document.getElementById('polish');
  const refine = document.getElementById('refine');
  const svg = document.getElementById('voice-lines');

  const s = svg.getBoundingClientRect();
  const pillR = pill.getBoundingClientRect();
  const polR = polish.getBoundingClientRect();
  const refR = refine.getBoundingClientRect();

  // Start: right edge of pill, vertically centered
  const sx = pillR.right - s.left + 6;
  const sy = pillR.top - s.top + pillR.height / 2;

  // End: center of bottom edge of each step, relative to SVG
  const px = polR.left - s.left + polR.width / 2;
  const py = polR.bottom - s.top + 4; // 4px gap below step

  const rx = refR.left - s.left + refR.width / 2;
  const ry = refR.bottom - s.top + 4;

  const a = 4; // arrowhead size

  svg.innerHTML = `
    <path d="M${sx} ${sy} H${px} V${py}" stroke="#1a7a6a" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 3" fill="none"/>
    <path d="M${px-a} ${py+a+1} L${px} ${py} L${px+a} ${py+a+1}" stroke="#1a7a6a" stroke-width="1" stroke-opacity="0.5" fill="none"/>
    <path d="M${px} ${sy} H${rx} V${ry}" stroke="#1a7a6a" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="4 3" fill="none"/>
    <path d="M${rx-a} ${ry+a+1} L${rx} ${ry} L${rx+a} ${ry+a+1}" stroke="#1a7a6a" stroke-width="1" stroke-opacity="0.5" fill="none"/>
  `;
}

drawLines();
window.addEventListener('resize', drawLines);
</script>

</body>
</html>
